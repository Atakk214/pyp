# 1. NOMBRE DE LA APLICACIÓN Y PUERTO DE RED LOCAL
spring.application.name=sistema-pyp-framework
server.port=8080

# 2. CONEXIÓN A BASE DE DATOS FÍSICA MYSQL ('sistema_pyp')
# createDatabaseIfNotExist=true crea la base de datos si aún no existe en el servidor MySQL local.
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_pyp?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. GESTIÓN ORM CON SPRING DATA JPA E HIBERNATE
# 'update': Actualiza la estructura de las tablas para que coincida con las entidades JPA
# sin eliminar registros existentes en la base de datos.
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola las consultas SQL generadas por Hibernate (nivel formativo/pedagógico)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactiva Open-In-View para promover buenas prácticas de rendimiento y cierre de conexiones
spring.jpa.open-in-view=false

# 4. CONFIGURACIÓN DEL MOTOR DE PLANTILLAS THYMELEAF
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# 5. CARGA DE DATOS INICIALES DE DEMOSTRACIÓN (data.sql)
# 'always': Ejecuta data.sql al iniciar si la tabla está vacía para pruebas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
